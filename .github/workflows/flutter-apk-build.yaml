name: Flutter-Android Build Dev

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

#      - name: Setup JDK
#        uses: actions/setup-java@v4
#        with:
#          java-version: '17'
#          distribution: 'zulu'

      - name: Setup Base URL FIle
        run: echo "${{ secrets.BASE_URL_FILE }}" | base64 --decode > lib/main.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.3

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        run : |
          cd iOS
          pod install --repo update
          cd ..

      - name: Build iOS
        run: flutter build ipa --debug --build-name=1.0.0 --build-number=1